name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # EckCo shipped with a printed letter; its page must never change.
      - name: EckCo page unchanged
        run: npm run check:eckco-frozen

      # Mursix shipped with a printed letter too; template 2 keeps growing,
      # so its rendered page is held still by this gate.
      - name: Mursix page unchanged
        run: npm run check:mursix-frozen

      # Dashboard footers carry no GitHub link, on any page, ever.
      - name: No GitHub link on dashboard pages
        run: npm run check:no-github
